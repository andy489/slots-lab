<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#1a1a2e"/>
  <!-- Slot machine reels: 3 columns of 3 cells -->
  <rect x="6" y="12" width="15" height="40" rx="3" fill="#16213e" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="25" y="12" width="15" height="40" rx="3" fill="#16213e" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="44" y="12" width="15" height="40" rx="3" fill="#16213e" stroke="#4f46e5" stroke-width="1.5"/>
  <!-- Dividers -->
  <line x1="6" y1="25" x2="21" y2="25" stroke="#4f46e5" stroke-width="0.8"/>
  <line x1="6" y1="38" x2="21" y2="38" stroke="#4f46e5" stroke-width="0.8"/>
  <line x1="25" y1="25" x2="40" y2="25" stroke="#4f46e5" stroke-width="0.8"/>
  <line x1="25" y1="38" x2="40" y2="38" stroke="#4f46e5" stroke-width="0.8"/>
  <line x1="44" y1="25" x2="59" y2="25" stroke="#4f46e5" stroke-width="0.8"/>
  <line x1="44" y1="38" x2="59" y2="38" stroke="#4f46e5" stroke-width="0.8"/>
  <!-- Middle row highlight (win line) -->
  <rect x="5" y="24.5" width="55" height="14" rx="2" fill="#4f46e5" opacity="0.15"/>
  <!-- Symbols: stars on middle row -->
  <text x="13.5" y="35.5" text-anchor="middle" font-size="9" fill="#f59e0b">★</text>
  <text x="32.5" y="35.5" text-anchor="middle" font-size="9" fill="#f59e0b">★</text>
  <text x="51.5" y="35.5" text-anchor="middle" font-size="9" fill="#f59e0b">★</text>
  <!-- Other symbols -->
  <text x="13.5" y="22" text-anchor="middle" font-size="8" fill="#6b7280">7</text>
  <text x="32.5" y="22" text-anchor="middle" font-size="8" fill="#6b7280">♦</text>
  <text x="51.5" y="22" text-anchor="middle" font-size="8" fill="#6b7280">7</text>
  <text x="13.5" y="49" text-anchor="middle" font-size="8" fill="#6b7280">♣</text>
  <text x="32.5" y="49" text-anchor="middle" font-size="8" fill="#6b7280">♣</text>
  <text x="51.5" y="49" text-anchor="middle" font-size="8" fill="#6b7280">♦</text>
</svg>
