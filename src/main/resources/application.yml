server:
  port: 8080

spring:
  application:
    name: slot-lab
  thymeleaf:
    cache: false
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources
      exclude: static/**
    livereload:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    env:
      show-values: always

keep-alive:
  interval-seconds: 840
  initial-delay-seconds: 15

history:
  session-ttl-days: 7

agent:
  max-attempts: 3
  skills-path: skills/
  human-in-the-loop:
    enabled: true

logging:
  level:
    com.slotslab.agent: DEBUG

tabs:
  generate:  true
  rtp:       true
  spin-test: true
  convert:   true
  io:        true
  ai:        false

springdoc:
  swagger-ui:
    path: /api-docs
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true
  api-docs:
    path: /api-docs/json
    enabled: true
